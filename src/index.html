<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Coin Change Game</title>

<style>
body {
    background: #2f333a;
    display: flex;
    flex-direction: column; 
    align-items: center;
    height: 100vh;
    font-family: Arial;
    margin: 0;
}

.titulo-principal {
    text-align: center;
    color: #f1c40f;
    font-size: 32px;
    margin-top: 15px;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: bold;
}

.game-wrapper {
    transform: scale(0.8);
    transform-origin: top center;
}

.game-wrapper {
    display: flex;
    gap: 30px;
    align-items: stretch;
    max-width: 900px;
    width: 100%;
    padding: 20px;
}

.container {
    width: 420px;
    color: white;
}

.instrucao-topo {
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    color: #f1c40f;
    margin-bottom: 15px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.cash-register {
    width: 400px;
    background: #3a3f47;
    border-radius: 12px;
    padding: 20px;
    color: white;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    border: 4px solid #1e2124;
    display: flex;
    flex-direction: column;
}

.register-title {
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 15px;
    color: #f1c40f;
    text-transform: uppercase;
    letter-spacing: 1px;
    border-bottom: 2px solid #2f333a;
    padding-bottom: 10px;
}

.drawer-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    margin-bottom: 20px;
}

.cash-slot {
    background: #2b2e33;
    border: 2px dashed #555;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 15px;
    cursor: pointer;
    user-select: none;
    transition: transform 0.1s, border-color 0.2s;
}

.cash-slot:hover { border-color: #2ecc71; }
.cash-slot:active { transform: scale(0.95); }

.visual-counter-area {
    border-top: 2px solid #2f333a;
    padding-top: 10px;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
}

.visual-counter-title {
    font-size: 14px;
    font-weight: bold;
    color: #f1c40f;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
}

.visual-accumulated {
    background: #1e2124;
    border-radius: 8px;
    padding: 12px;
    min-height: 60px;
    max-height: 120px;
    overflow-y: auto;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-content: flex-start;
}

.reset-accumulated-btn {
    margin-top: 10px;
    background: #e67e22;
    color: white;
    border: none;
    padding: 15px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    font-size: 24px;
    width: 100%;
}
.reset-accumulated-btn:hover { opacity: 0.9; }

.mini-money {
    font-weight: bold;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.mini-rect { width: 42px; height: 24px; border-radius: 3px; }
.mini-circle { width: 25px; height: 25px; border-radius: 50%; }

.money-rect {
    width: 100px;
    height: 50px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 18px;
}
.money-circle {
    width: 55px;
    height: 55px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 18px;
}

.m-100 { background: #a2d2ff; color: #03045e; border: 2px solid #0077b6; }
.m-50  { background: #ffe5ec; color: #641220; border: 2px solid #e01e37; }
.m-25  { background: #d8f3dc; color: #1b4332; border: 2px solid #40916c; }
.m-10  { background: #fde2e4; color: #5e503f; border: 2px solid #a3704c; }
.m-5   { background: #e2e2e2; color: #333333; border: 2px solid #888888; }
.m-1   { background: #ffe5a3; color: #5a3d00; border: 2px solid #d4af37; }

.slot-label {
    margin-top: 8px;
    font-size: 12px;
    color: #bbb;
}

#topMessage {
    width: 100%;
    text-align: center;
    font-size: 26px;
    font-weight: bold;
    padding: 10px 0;
    margin-bottom: 12px;
    border-radius: 6px;
    display: none;
}

.screen {
    background: #78eef5;
    padding: 10px;
    border-radius: 5px;
    text-align: center;
    color: black;
    font-size: 22px;
    font-weight: bold;
    min-height: 90px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
}

.info-btn {
    position: absolute;
    right: 10px;
    top: 10px;
    width: 50px;
    height: 32px;
    background: #2ecc71;
    border-radius: 5px;
    border: 2px solid #27ae60;
    cursor: pointer;
}

.info-btn .circle {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #f7d75b;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: #5a3d00;
    font-weight: bold;
}

.black-bar {
    margin: 15px 0;
    height: 26px;
    background: black;
    border-radius: 4px;
}

.teclado-wrapper {
    background: #3a3f47;
    border: 4px solid #1e2124;
    border-radius: 12px;
    padding: 20px;
    margin-top: 0px;
}

.keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.btn {
    background: #c8d2dc;
    text-align: center;
    padding: 15px 0;
    font-size: 22px;
    border-radius: 10px;
    cursor: pointer;
    color: black;
    font-weight: bold;
}
.btn:hover { opacity: 0.8; }

.clear-btn { background: #e74c3c; color: white; }
.reset-btn { background: #f4a007; font-size: 25px; }
.confirm-btn {
    grid-column: span 3;
    background: #32d957;
    color: black;
    font-size: 24px;
    padding: 18px 0;
}
</style>
</head>

<body>

<h1 class="titulo-principal">Coin Change Game</h1>

<div class="game-wrapper">

    <div class="cash-register">
        <div class="register-title">Cédulas disponíveis</div>

        <div class="drawer-grid">
            <div class="cash-slot" onclick="pegarDinheiro(100)">
                <div class="money-rect m-100">100</div>
                <div class="slot-label">CÉDULA</div>
            </div>
            <div class="cash-slot" onclick="pegarDinheiro(50)">
                <div class="money-rect m-50">50</div>
                <div class="slot-label">CÉDULA</div>
            </div>
            <div class="cash-slot" onclick="pegarDinheiro(25)">
                <div class="money-rect m-25">25</div>
                <div class="slot-label">CÉDULA</div>
            </div>
            <div class="cash-slot" onclick="pegarDinheiro(10)">
                <div class="money-rect m-10">10</div>
                <div class="slot-label">CÉDULA</div>
            </div>
            <div class="cash-slot" onclick="pegarDinheiro(5)">
                <div class="money-rect m-5">5</div>
                <div class="slot-label">CÉDULA</div>
            </div>
            <div class="cash-slot" onclick="pegarDinheiro(1)">
                <div class="money-circle m-1">1</div>
                <div class="slot-label">MOEDA</div>
            </div>
        </div>

        <div class="visual-counter-area">
            <div class="visual-counter-title">
                <span>Notas Selecionadas:</span>
                <span id="labelContagem">Total: 0 un</span>
            </div>

            <div class="visual-accumulated" id="painelAcumulado"></div>

            <button class="reset-accumulated-btn" onclick="limparDinheiroPegado()">Devolver ao Caixa</button>
        </div>
    </div>

    <div class="container">
        <div class="teclado-wrapper">
        <div class="instrucao-topo">Quantas cédulas são necessárias para esse troco?</div>

        <div id="topMessage"></div>

        <div class="screen" id="screen">
            Carregando...
        </div>

        <div class="black-bar"></div>

        <div class="keypad">
            <div class="btn" onclick="press(1)">1</div>
            <div class="btn" onclick="press(2)">2</div>
            <div class="btn" onclick="press(3)">3</div>
            <div class="btn" onclick="press(4)">4</div>
            <div class="btn" onclick="press(5)">5</div>
            <div class="btn" onclick="press(6)">6</div>
            <div class="btn" onclick="press(7)">7</div>
            <div class="btn" onclick="press(8)">8</div>
            <div class="btn" onclick="press(9)">9</div>
            <div class="btn clear-btn" onclick="clearInput()">C</div>
            <div class="btn" onclick="press(0)">0</div>
            <div class="btn reset-btn" onclick="novoDesafio()">⟲</div>
            <div class="btn confirm-btn" onclick="confirmar()">Confirmar</div>
            </div>
        </div>

    </div>

</div>

<script>
let resposta = "";
let valorDesafio = 0;
let bloqueado = false;

const cedulas = [100, 50, 25, 10, 5, 1];
let dinheiroAcumulado = [];

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playBeep(f, d, t) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = t || 'sine';
    o.frequency.setValueAtTime(f, audioCtx.currentTime);
    g.gain.setValueAtTime(0.1, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + d);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + d);
}

function novoDesafio() {
    bloqueado = false;
    resposta = "";
    valorDesafio = Math.floor(Math.random() * 450) + 50;
    document.getElementById("topMessage").style.display = "none";

    let screen = document.getElementById("screen");
    screen.style.background = "#78eef5";
    screen.style.color = "black";

    limparDinheiroPegado();
    atualizarTela();
}

function atualizarTela() {
    document.getElementById("screen").innerHTML =
        `Valor: R$ ${valorDesafio}<br>Resposta: ${resposta || "-"}
         `;
}

function press(n) {
    if (bloqueado) return;
    playBeep(880, 0.1, 'sine');
    if (resposta.length < 4) resposta += n;
    atualizarTela();
}

function clearInput() {
    if (bloqueado) return;
    playBeep(440, 0.15, 'triangle');
    resposta = "";
    atualizarTela();
}

function pegarDinheiro(v) {
    if (bloqueado) return;
    playBeep(1200, 0.08, 'triangle');
    dinheiroAcumulado.push(v);
    atualizarPainelAcumulado();
}

function limparDinheiroPegado() {
    if (dinheiroAcumulado.length > 0) playBeep(300, 0.15, 'sine');
    dinheiroAcumulado = [];
    atualizarPainelAcumulado();
}

function atualizarPainelAcumulado() {
    const painel = document.getElementById("painelAcumulado");
    const label = document.getElementById("labelContagem");
    painel.innerHTML = "";
    dinheiroAcumulado.forEach(valor => {
        const d = document.createElement("div");
        d.className = valor <= 5 ? `mini-money mini-circle m-${valor}`
                                 : `mini-money mini-rect m-${valor}`;
        d.innerText = valor;
        painel.appendChild(d);
    });
    label.innerText = `${dinheiroAcumulado.length} un`;
}

function minimoCedulas(v) {
    let usadas = [];
    for (let c of cedulas) {
        let q = Math.floor(v / c);
        while (q--) usadas.push(c);
        v %= c;
    }
    return usadas;
}

function confirmar() {
    if (resposta === "") return;

    bloqueado = true;

    const usadas = minimoCedulas(valorDesafio);
    const correto = usadas.length;

    let top = document.getElementById("topMessage");

    document.getElementById("screen").innerHTML =
        `Valor: R$ ${valorDesafio}<br>
         Resposta correta: ${correto}<br>
         Usadas: ${usadas.join(", ")}
         `;

    if (parseInt(resposta) === correto) {
        playBeep(523, 0.1, 'sine');
        setTimeout(() => playBeep(1046, 0.2, 'sine'), 100);
        top.style.display = "block";
        top.style.background = "#2ecc71";
        top.innerHTML = "YOU WIN!";
    } else {
        playBeep(350, 0.15, 'sawtooth');
        setTimeout(() => playBeep(220, 0.25, 'sawtooth'), 120);
        top.style.display = "block";
        top.style.background = "#e74c3c";
        top.style.color = "white";
        top.innerHTML = "YOU LOSS!";
    }
}

novoDesafio();
</script>

</body>
</html>
